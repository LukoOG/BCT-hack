# ── BCT Hack — docker-compose.yml ────────────────────────────────────────────
#
# Services:
#   api   → FastAPI  http://localhost:8000/docs
#   demo  → Streamlit  http://localhost:8501
#
# Prerequisites (run ONCE on the host):
#   python scripts/build_all.py --skip-fetch
#
# Start everything:
#   docker compose up --build
#
# Pass Groq key without a .env file (e.g. on a cloud host):
#   GROQ_API_KEY=gsk_... docker compose up --build
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── FastAPI ──────────────────────────────────────────────────────────────────
  api:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false          # safe on a clean clone with no .env
    environment:
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-tfidf}
      - GROQ_API_KEY=${GROQ_API_KEY:-}        # pass-through: host env var OR .env
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
    volumes:
      - ./data:/app/data:ro      # read-only mount — API never writes data/
    restart: unless-stopped      # auto-recover from crashes
    command: >
      python -m uvicorn app.api.server:app
      --host 0.0.0.0
      --port 8000
      --workers 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s          # uvicorn needs time to load FAISS index on startup

  # ── Streamlit ─────────────────────────────────────────────────────────────────
  demo:
    build: .
    ports:
      - "8501:8501"
    env_file:
      - path: .env
        required: false
    environment:
      - EMBEDDING_BACKEND=${EMBEDDING_BACKEND:-tfidf}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - API_BASE_URL=http://api:8000    # Docker internal network — NOT localhost
    volumes:
      - ./data:/app/data:ro
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy     # wait for /health to pass, not just container start
    command: >
      python -m streamlit run app/frontend/streamlit_app.py
      --server.port 8501
      --server.address 0.0.0.0
      --server.headless true
      --server.enableCORS false
      --server.enableXsrfProtection false